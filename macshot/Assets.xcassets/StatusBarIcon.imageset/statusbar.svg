<?xml version="1.0" encoding="utf-8" ?>
<!--
  Menu bar icon. Sized for a 16-18pt slot, i.e. 32-36px on Retina, which is the
  constraint that drives every number here: a stroke thinner than ~2px lands on
  sub-pixel boundaries and antialiases to grey, so an icon built from hairlines
  reads as a washed-out smudge next to solid neighbours no matter how much total
  ink it carries. Everything below is therefore >= 1.4 units (~2px) thick, and
  the lens is one solid block rather than six shutter blades whose gaps would
  blur into each other at this size.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <g fill="none" stroke="black" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M1.9 7.3 V4.0 A2.1 2.1 0 0 1 4.0 1.9 H7.3"/>
    <path d="M14.7 1.9 H18.0 A2.1 2.1 0 0 1 20.1 4.0 V7.3"/>
    <path d="M20.1 14.7 V18.0 A2.1 2.1 0 0 1 18.0 20.1 H14.7"/>
    <path d="M7.3 20.1 H4.0 A2.1 2.1 0 0 1 1.9 18.0 V14.7"/>
  </g>
  <path fill="black" fill-rule="evenodd"
        d="M11 5.85 a5.15 5.15 0 1 0 0.01 0 Z M11 9.05 a1.95 1.95 0 1 1 -0.01 0 Z"/>
</svg>
